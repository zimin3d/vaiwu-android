name: Refresh dependency locks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: wrapper

      - name: Regenerate locks and verification metadata
        run: |
          ./gradlew --no-daemon \
            --write-locks \
            --write-verification-metadata sha256 \
            :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

      - name: Commit refreshed files
        run: |
          if git diff --quiet -- app/gradle.lockfile gradle/verification-metadata.xml; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile gradle/verification-metadata.xml
          git commit -m "Refresh dependency locks and verification metadata"
          git push
