name: Refresh dependency locks

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: wrapper

      - name: Regenerate locks and verification metadata
        run: |
          ./gradlew --no-daemon \
            --write-locks \
            --write-verification-metadata sha256 \
            :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest

      - name: Open pull request with refreshed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- app/gradle.lockfile gradle/verification-metadata.xml; then
            echo "Nothing to update."
            exit 0
          fi
          BRANCH="chore/refresh-dependencies"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add app/gradle.lockfile gradle/verification-metadata.xml
          git commit -m "Refresh dependency locks and verification metadata"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "Refresh dependency locks and verification metadata" \
            --body "Automated refresh of Gradle lockfile and SHA-256 verification metadata." \
            || gh pr edit "$BRANCH" --title "Refresh dependency locks and verification metadata"
