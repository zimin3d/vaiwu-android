name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: wrapper

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ github.ref_type == 'tag' && secrets.KEYSTORE_B64 || '' }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KEYSTORE_B64 is not set: building a debug-signed APK, no GitHub release will be published"
          else
            B64="$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')"
            if ! printf '%s' "$B64" | python3 -c "import base64,sys; s=sys.stdin.read(); s=s[:s.rfind('=')+1] if '=' in s else s; s=s.rstrip('='); s+='='*(-len(s)%4); sys.stdout.buffer.write(base64.b64decode(s, validate=True))" > "$RUNNER_TEMP/vaiwu.p12" 2>/dev/null; then
              echo "::error::KEYSTORE_B64 cannot be decoded"
              exit 1
            fi
            SIGNED=1
            echo "KEYSTORE_FILE=$RUNNER_TEMP/vaiwu.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
          echo "signed=${SIGNED:-0}" >> "$GITHUB_OUTPUT"

      - name: Verify signing key
        if: env.SIGNED == '1'
        env:
          KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.KEYSTORE_PASSWORD || '' }}
        run: |
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          keytool -list -storetype pkcs12 -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias filament > /dev/null

      - name: Run native host unit tests
        run: python3 app/src/test/cpp/run_host_tests.py

      - name: Run art tooling tests
        run: python3 -m unittest discover -s tools/art -t tools/art

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.KEYSTORE_PASSWORD || '' }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            export KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
            echo "::add-mask::$KEYSTORE_PASSWORD"
          fi
          EXTRA_ARGS=()
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            # Dependabot bumps versions before we can refresh verification
            # metadata; warn instead of failing the whole build.
            EXTRA_ARGS+=(--dependency-verification=lenient)
          fi
          set -o pipefail
          ./gradlew --no-daemon "${EXTRA_ARGS[@]}" lintDebug testDebugUnitTest assembleRelease 2>&1 | tee build.log
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/vaiwu-android.apk

      - name: Verify APK signature
        if: env.SIGNED == '1'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose out/vaiwu-android.apk

      - name: Expose build error
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build.log")
          text = path.read_text(errors="replace")[-4000:] if path.exists() else "Build step failed before Gradle started"
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::{text}")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vaiwu-android-apk
          path: out/vaiwu-android.apk
          retention-days: 14

  release:
    if: github.ref_type == 'tag' && needs.build.outputs.signed == '1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vaiwu-android-apk
          path: out

      - name: Publish signed release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # Release notes are maintained here: user-facing changelog for the update dialog.
          body: |
            ## Vaiwu v0.2.1

            ### Анимации спрайтов
            - Добавлены покадровые анимации для Akane (`idle`, `happy`, `sleepy`), исправлены кадры Aoi и добавлено плавное дыхание для всех живых персонажей.
            - Добавлена поддержка системной настройки Reduced Motion (отключение лишней анимации).

            ### Обновление UI/UX и доступности
            - Исправлен контраст кнопок в мини-игре «Мелодия», цвета результатов мини-игр и КНБ, а также отображение RPG-характеристик на экране питомца (стартовые статы больше не подсвечиваются красным).
            - Минимальный размер всех кнопок и зон нажатия доведён до стандарта Android 48dp; унифицирована форма кнопок, переработаны экраны Настроек и Справки.
            - Добавлен тактильный отклик нажатия на кнопки и карточки, плавное появление облачка речи и баннера болезни, мягкие переходы экранов и контрастное выделение активной вкладки в нижней панели.
            - В чате сообщения питомца и пользователя разделены по сторонам, добавлены подсказки на пустом экране и сохранение набранного текста при повороте; на экране игр при усталости добавлен баннер с переходом на главную; в онбординге устранён скачок сетки при выборе героини.

            ### Производительность и безопасность
            - Включён даунсэмплинг спрайтов при загрузке (`inSampleSize`), снижающий потребление оперативной памяти на 75%.
            - Усилена проверка URL обновлений (пин официального репозитория), явное уведомление при сбое сохранения API-ключа и защита границы JNI/C++ от исключений.

            **Сравнение с предыдущей версией:** https://github.com/zimin3d/vaiwu-android/compare/v0.2.0...v0.2.1
          files: out/vaiwu-android.apk
